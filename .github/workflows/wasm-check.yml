name: WASM Compile Check

on:
  push:
    branches: [main, feat/wasm-compose]
    paths:
      - 'webApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/wasm-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Compile wasmJs
        run: |
          ./gradlew :webApp:compileKotlinWasmJs --stacktrace --no-daemon
        env:
          GRADLE_OPTS: '-Xmx3g'

      - name: Dist
        run: |
          ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace --no-daemon

      - name: Show output
        if: always()
        run: |
          echo '=== dist ==='
          find webApp/build/dist -type f 2>/dev/null | head -30
          du -sh webApp/build/dist/wasmJs/productionExecutable 2>/dev/null || true
