name: WASM Compile Check

on:
  push:
    branches: [main, feat/wasm-compose]
    paths:
      - 'webApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '*.gradle.kts'
      - '.github/workflows/wasm-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      # Kotlin/Wasm 的 :kotlinWasmNodeJsSetup 会去 Maven 找 org.nodejs:node，
      # 国内镜像没有这个包 → 预下载并塞进本地 Ivy 仓库
      - name: Pre-seed Node.js into local Ivy repo
        run: |
          set -e
          NODE_VER=25.0.0
          IVY_DIR="$HOME/.gradle/local-node-repo/org.nodejs/node/$NODE_VER"
          mkdir -p "$IVY_DIR"
          cd /tmp
          curl -fsSL --retry 3 -o node.tar.gz \
            "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.gz"
          ls -la node.tar.gz
          # Ivy pattern: [artifact]v[revision]/[artifact]v[revision]-[classifier].[ext]
          cp node.tar.gz "$IVY_DIR/node-v${NODE_VER}-linux-x64.tar.gz"
          # 也放一份 Maven 布局（org.nodejs:node:<ver>:linux-x64@tar.gz）
          MAVEN_DIR="$HOME/.gradle/local-node-repo/org/nodejs/node/$NODE_VER"
          mkdir -p "$MAVEN_DIR"
          cp node.tar.gz "$MAVEN_DIR/node-$NODE_VER-linux-x64.tar.gz"
          echo "<project><modelVersion>4.0.0</modelVersion><groupId>org.nodejs</groupId><artifactId>node</artifactId><version>$NODE_VER</version></project>" > "$MAVEN_DIR/node-$NODE_VER.pom"
          find "$HOME/.gradle/local-node-repo" -type f | head -10

      # Binaryen（wasm-opt）同样不在 Maven，从 GitHub Releases 预下载
      - name: Pre-seed Binaryen into local repo
        run: |
          set -e
          BIN_VER=125
          BASE="$HOME/.gradle/local-node-repo/com/github/webassembly/binaryen/$BIN_VER"
          mkdir -p "$BASE"
          cd /tmp
          curl -fsSL --retry 3 -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BIN_VER}/binaryen-version_${BIN_VER}-x86_64-linux.tar.gz"
          ls -la binaryen.tar.gz
          cp binaryen.tar.gz "$BASE/binaryen-${BIN_VER}-x86_64-linux.tar.gz"
          echo '<?xml version="1.0" encoding="UTF-8"?><project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>com.github.webassembly</groupId><artifactId>binaryen</artifactId><version>'"$BIN_VER"'</version><packaging>tar.gz</packaging></project>' > "$BASE/binaryen-${BIN_VER}.pom"
          find "$BASE" -type f

      - name: Compile wasmJs
        run: |
          gradle :webApp:compileKotlinWasmJs --stacktrace --no-daemon
        env:
          GRADLE_OPTS: '-Xmx3g'

      - name: Dist
        run: |
          gradle :webApp:wasmJsBrowserDistribution --stacktrace --no-daemon

      - name: Show output
        if: always()
        run: |
          echo '=== dist ==='
          find webApp/build/dist -type f 2>/dev/null | head -30
          du -sh webApp/build/dist/wasmJs/productionExecutable 2>/dev/null || true
