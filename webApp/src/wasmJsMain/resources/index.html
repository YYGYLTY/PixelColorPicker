<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixelColorPicker</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #08090F; overflow: hidden;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  /* ComposeViewport 的 viewportContainer 需要普通 HTMLElement，
     它会在内部自己创建 canvas + 输入用 textarea。
     传 <canvas> 会导致内部 append 的元素不可见 -> 黑屏。 */
  #ComposeTarget {
    width: 100%; height: 100%; display: block;
    position: absolute; top: 0; left: 0;
    overflow: hidden;
  }
  #ComposeTarget > canvas {
    display: block; width: 100%; height: 100%;
  }
  #boot {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: #08090F; color: #9AA0B4; font-size: 14px;
    transition: opacity .35s ease; z-index: 10;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #bar {
    width: 62vw; max-width: 320px; height: 5px;
    background: #1A1D2B; border-radius: 3px; overflow: hidden;
  }
  #barfill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #7C5CFF, #B49CFF);
    border-radius: 3px; transition: width .25s ease;
  }
  #bar.done { opacity: 0; transition: opacity .3s ease; }
  #bootlog {
    max-width: 92vw; max-height: 52vh; overflow: auto;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #6D7288; text-align: left; white-space: pre-wrap;
    word-break: break-all; padding: 0 12px;
  }
  #bootlog b { color: #7C5CFF; }
  #boot .ring {
    width: 34px; height: 34px;
    border: 3px solid #1E2130; border-top-color: #7C5CFF;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 错误面板：出问题时直接显示在页面最上层 */
  #diag {
    position: fixed; inset: 0; z-index: 99999;
    display: none; padding: 14px;
    background: #12090C; color: #FFB4B4;
    font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
    overflow: auto; white-space: pre-wrap; word-break: break-all;
    -webkit-user-select: text; user-select: text;
  }
  #diag.on { display: block; }
  #diag b { color: #FF7A7A; }
  #diag .ok { color: #7CD48A; }
  #diag .dim { color: #8A8FA3; }
</style>
</head>
<body>
<div id="boot">
  <div class="ring"></div>
  <div id="bootmsg">正在加载核心引擎…</div>
  <div id="bar"><div id="barfill"></div></div>
  <div id="bootlog"></div>
</div>
<div id="ComposeTarget"></div>
<div id="diag"></div>

<script>
(function () {
  var logs = [];
  var diag = document.getElementById('diag');
  var boot = document.getElementById('boot');
  var shown = false;

  function stamp() {
    var t = new Date();
    return t.toTimeString().slice(0, 8) + '.' + String(t.getMilliseconds()).padStart(3, '0');
  }

  var bootlog = document.getElementById('bootlog');

  function push(kind, msg) {
    var line = '[' + stamp() + '] ' + kind + ' ' + msg;
    logs.push(line);
    if (logs.length > 200) logs.shift();
    if (shown) diag.textContent = logs.join('\n');
    // 加载阶段实时回显到页面，方便直接截图定位卡点
    if (bootlog && !shown) {
      bootlog.textContent = logs.slice(-14).join('\n');
    }
  }

  // 暴露给 Kotlin 侧调用的探针
  window.__pcpMark = function (msg) { push('KOTLIN', String(msg)); };

  // 显示诊断面板（用户可截图）
  window.__pcpShowDiag = function (reason) {
    shown = true;
    if (boot) boot.style.display = 'none';
    diag.classList.add('on');
    var head = '<b>PixelColorPicker wasm 启动失败</b>\n' +
               '原因: ' + (reason || '未知') + '\n' +
               'UA: ' + navigator.userAgent + '\n' +
               'DPR: ' + (window.devicePixelRatio || 1) + '\n' +
               '尺寸: ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
               'WebGL2: ' + testGL('webgl2') + '\n' +
               'WebGL1: ' + testGL('webgl') + '\n' +
               'Wasm: ' + (typeof WebAssembly) + '\n' +
               '---------------\n';
    diag.textContent = head + logs.join('\n');
  };

  function testGL(type) {
    try {
      var c = document.createElement('canvas');
      var g = c.getContext(type);
      if (!g) return '不支持/null';
      var dbg = g.getExtension('WEBGL_debug_renderer_info');
      var r = dbg ? g.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : g.getParameter(g.RENDERER);
      return 'OK / ' + r;
    } catch (e) { return '异常 ' + e.message; }
  }

  // 捕获所有错误
  window.addEventListener('error', function (e) {
    var m = (e && e.message) || 'unknown';
    var src = e && e.filename ? (' @ ' + e.filename.split('/').pop() + ':' + e.lineno) : '';
    push('ERROR', m + src);
    // 启动阶段的错误直接弹面板
    if (!window.__pcpReady) window.__pcpShowDiag('window.error');
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    var m = (r && (r.stack || r.message)) || String(r);
    push('REJECT', String(m).slice(0, 800));
    if (!window.__pcpReady) window.__pcpShowDiag('unhandledrejection');
  });

  // console.error 也抓
  var oe = console.error;
  console.error = function () {
    var a = Array.prototype.slice.call(arguments).map(function (x) {
      try { return (x && (x.stack || x.message)) || String(x); } catch (_) { return '[obj]'; }
    }).join(' ');
    push('CONSOLE', a.slice(0, 800));
    oe.apply(console, arguments);
  };

  push('INFO', 'HTML 已执行，开始等待 wasm');

  // ---- 网络监控：包装 fetch/XHR，旁路观察所有 wasm 下载进度 ----
  (function watchNetwork() {
    var barfill = document.getElementById('barfill');
    var bootmsg = document.getElementById('bootmsg');
    var files = {};
    var order = [];

    function render() {
      var got = 0, total = 0, i;
      for (i = 0; i < order.length; i++) {
        got += files[order[i]].got;
        if (files[order[i]].total > 0) total += files[order[i]].total;
      }
      var mb = function (b) { return (b / 1048576).toFixed(2); };
      if (total > 0) {
        var pct = Math.min(100, Math.round(got / total * 100));
        if (barfill) barfill.style.width = pct + '%';
        if (bootmsg) {
          bootmsg.textContent = pct >= 100
            ? ('资源下载完成（' + mb(got) + 'MB），正在编译启动…')
            : ('正在下载资源 ' + pct + '%（' + mb(got) + ' / ' + mb(total) + 'MB）');
        }
      } else if (got > 0) {
        if (bootmsg) bootmsg.textContent = '正在下载 ' + mb(got) + 'MB';
      }
    }

    function track(url) {
      if (!files[url]) { files[url] = { got: 0, total: 0 }; order.push(url); }
      return files[url];
    }

    if (window.fetch) {
      var of = window.fetch;
      window.fetch = function (input) {
        var url = '';
        try { url = (typeof input === 'string') ? input : (input && input.url) || ''; } catch (e) {}
        var pr = of.apply(this, arguments);
        if (!/\.wasm(\?|$)/.test(url)) return pr;
        var name = url.split('/').pop().split('?')[0];
        var rec = track(url);
        push('NET', '请求 ' + name);
        pr.then(function (resp) {
          try {
            var t = parseInt(resp.headers.get('content-length') || '0', 10);
            if (t > 0) rec.total = t;
            render();
          } catch (e) {}
          if (!resp.body || !resp.clone) return;
          var reader = resp.clone().body.getReader();
          (function pump() {
            return reader.read().then(function (r) {
              if (r.done) {
                push('NET', name + ' 下载完 ' + (rec.got / 1048576).toFixed(2) + 'MB');
                render();
                return;
              }
              rec.got += r.value.length;
              render();
              return pump();
            });
          })().catch(function () {});
        }).catch(function (e) {
          push('NET', name + ' 失败: ' + (e && e.message));
        });
        return pr;
      };
    }

    if (window.XMLHttpRequest) {
      var OX = window.XMLHttpRequest;
      window.XMLHttpRequest = function () {
        var x = new OX();
        var url = '';
        var os = x.open;
        x.open = function (m, u) { url = u || ''; return os.apply(x, arguments); };
        x.addEventListener('progress', function (ev) {
          if (!/\.wasm(\?|$)/.test(url)) return;
          var rec = track(url);
          if (ev.lengthComputable) rec.total = ev.total;
          rec.got = ev.loaded;
          render();
        });
        return x;
      };
    }
  })();

  // 检测 canvas 是否真的被绘制过（Compose 首帧会设置非零尺寸并绘制）
  var tries = 0;
  var timer = setInterval(function () {
    var host = document.getElementById('ComposeTarget');
    var c = host ? host.querySelector('canvas') : null;
    tries++;
    var w = c ? c.width : 0;
    var h = c ? c.height : 0;
    if (tries === 1) push('INFO', '容器 ' + (host ? 'OK' : '缺失') + ' / canvas ' + (c ? '已建' : '未建'));
    if (w > 1 && h > 1) {
      clearInterval(timer);
      push('INFO', 'canvas 已就绪 ' + w + 'x' + h + ' -> 隐藏加载层');
      window.__pcpReady = true;
      if (boot) {
        boot.classList.add('hide');
        setTimeout(function () { if (boot) boot.remove(); }, 400);
      }
    } else {
      // 每 5 秒报一次进度（wasm 总共约 4.2MB，慢网下需要 1-3 分钟）
      if (tries % 50 === 0) {
        var sec = (tries / 10).toFixed(0);
        // 容器尺寸
        var hostInfo = host
          ? (host.clientWidth + 'x' + host.clientHeight +
             ' (offset ' + host.offsetWidth + 'x' + host.offsetHeight + ')')
          : '缺失';
        // 全文档 canvas 枚举
        var all = document.querySelectorAll('canvas');
        var cinfo = [];
        for (var k = 0; k < all.length; k++) {
          var cc = all[k];
          var pid = (cc.parentElement && (cc.parentElement.id || cc.parentElement.tagName)) || 'none';
          cinfo.push('#' + k + '{id=' + (cc.id || '-') + ',parent=' + pid +
            ',' + cc.width + 'x' + cc.height +
            ',css=' + cc.clientWidth + 'x' + cc.clientHeight + '}');
        }
        push('WAIT', sec + 's | 容器=' + hostInfo +
             ' | canvas数=' + all.length + (cinfo.length ? ' ' + cinfo.join(' ') : ''));
        if (tries === 50) {
          push('GL', 'WebGL2=' + testGL('webgl2'));
          push('GL', 'WebGL1=' + testGL('webgl'));
          push('GL', 'Wasm=' + (typeof WebAssembly) + ' / callStack=' + (typeof WebAssembly.Function));
          push('GL', 'body=' + document.body.clientWidth + 'x' + document.body.clientHeight +
               ' / dpr=' + (window.devicePixelRatio || 1));
        }
      }
      if (tries === 1800) {   // 180 秒兜底
        clearInterval(timer);
        if (!window.__pcpReady) window.__pcpShowDiag('180 秒仍未初始化');
      }
    }
  }, 100);
})();
</script>
<script src="webApp.js"></script>
</body>
</html>
