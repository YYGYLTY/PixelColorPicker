<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixelColorPicker · 图片像素化与色板码工具</title>
<meta name="description" content="把任意图片变成像素画，逐格取色，生成与 Android 版逐字节兼容的 18 色板码。纯本地离线运行，不上传任何图片。">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="brand-text">
      <h1 data-i18n="app.title">PixelColorPicker</h1>
      <p data-i18n="app.subtitle"></p>
    </div>
  </div>

  <div class="topbar-actions">
    <span class="badge-offline" data-i18n="app.badgeOffline"></span>
    <div class="seg lang-seg" id="langSeg">
      <button data-lang="zh">中文</button>
      <button data-lang="en">EN</button>
      <button data-lang="ja">日本語</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="generate"><span data-i18n="tab.generate">生成</span></button>
  <button class="tab" data-tab="palette"><span data-i18n="tab.palette">色板</span></button>
  <button class="tab" data-tab="code"><span data-i18n="tab.code">编码</span></button>
  <button class="tab" data-tab="editor"><span data-i18n="tab.editor">画布</span></button>
  <button class="tab" data-tab="about"><span data-i18n="tab.about">关于</span></button>
</nav>

<main>

  <!-- ================= 生成 ================= -->
  <section class="panel active" id="panel-generate">
    <div class="grid-2">

      <!-- 左：输入 -->
      <div class="col">
        <div class="card">
          <div class="card-head">
            <h2 data-i18n="size.title"></h2>
            <span class="hint" data-i18n="size.hint"></span>
          </div>
          <div class="size-row">
            <label class="field">
              <span data-i18n="size.width"></span>
              <input type="number" id="inW" value="16" min="1" max="999" inputmode="numeric">
            </label>
            <span class="times">×</span>
            <label class="field">
              <span data-i18n="size.height"></span>
              <input type="number" id="inH" value="16" min="1" max="999" inputmode="numeric">
            </label>
          </div>
          <div class="presets" id="presets">
            <span class="presets-label" data-i18n="size.presets"></span>
            <button data-size="8,8">8</button>
            <button data-size="16,16">16</button>
            <button data-size="32,32">32</button>
            <button data-size="64,64">64</button>
            <button data-size="128,128">128</button>
            <button data-size="16,32">16×32</button>
            <button data-size="32,64">32×64</button>
            <button data-size="64,128">64×128</button>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2 data-i18n="image.title"></h2></div>
          <div class="dropzone" id="dropzone" tabindex="0" role="button">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <div class="dz-inner" id="dzInner">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <circle cx="8.5" cy="9.5" r="1.5"/>
                <path d="M21 16l-5-5-6 6-3-3-4 4"/>
              </svg>
              <p class="dz-title" data-i18n="image.drop"></p>
              <p class="dz-sub" data-i18n="image.dropSub"></p>
            </div>
            <div class="dz-preview" id="dzPreview" hidden>
              <canvas id="previewCanvas"></canvas>
              <div class="dz-preview-meta">
                <span id="previewMeta"></span>
                <button class="btn tiny" id="changeImgBtn" data-i18n="image.change"></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card" id="cropCard" hidden>
          <div class="card-head">
            <h2 data-i18n="crop.title"></h2>
            <span class="hint" data-i18n="crop.hint"></span>
          </div>
          <div class="crop-stage" id="cropStage">
            <canvas id="cropCanvas"></canvas>
          </div>
          <div class="crop-controls">
            <label class="slider-row">
              <span data-i18n="crop.zoom"></span>
              <input type="range" id="scaleRange" min="0.2" max="4" step="0.01" value="1">
              <output id="scaleOut">1.00×</output>
            </label>
            <label class="slider-row">
              <span data-i18n="crop.rotate"></span>
              <input type="range" id="rotRange" min="-180" max="180" step="1" value="0">
              <output id="rotOut">0°</output>
            </label>
            <div class="btn-row">
              <button class="btn ghost sm" id="rotLeft" data-i18n="crop.rotLeft"></button>
              <button class="btn ghost sm" id="rotRight" data-i18n="crop.rotRight"></button>
              <button class="btn ghost sm" id="cropReset" data-i18n="crop.reset"></button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h2 data-i18n="algo.title"></h2></div>
          <div class="algo-grid" id="algoGrid">
            <label class="algo-card">
              <input type="radio" name="algo" value="nearest" checked>
              <span class="algo-body">
                <b data-i18n="algo.nearest"></b>
                <i data-i18n="algo.nearest.desc"></i>
              </span>
            </label>
            <label class="algo-card">
              <input type="radio" name="algo" value="bilinear">
              <span class="algo-body">
                <b data-i18n="algo.bilinear"></b>
                <i data-i18n="algo.bilinear.desc"></i>
              </span>
            </label>
            <label class="algo-card">
              <input type="radio" name="algo" value="bicubic">
              <span class="algo-body">
                <b data-i18n="algo.bicubic"></b>
                <i data-i18n="algo.bicubic.desc"></i>
              </span>
            </label>
            <label class="algo-card">
              <input type="radio" name="algo" value="lanczos">
              <span class="algo-body">
                <b data-i18n="algo.lanczos"></b>
                <i data-i18n="algo.lanczos.desc"></i>
              </span>
            </label>
            <label class="algo-card">
              <input type="radio" name="algo" value="average">
              <span class="algo-body">
                <b data-i18n="algo.average"></b>
                <i data-i18n="algo.average.desc"></i>
              </span>
            </label>
            <label class="algo-card">
              <input type="radio" name="algo" value="custom">
              <span class="algo-body">
                <b data-i18n="algo.custom"></b>
                <i data-i18n="algo.custom.desc"></i>
              </span>
            </label>
          </div>

          <div class="custom-panel" id="customPanel" hidden>
            <div class="custom-inner">
              <div class="custom-left">
                <label class="field-block">
                  <span data-i18n="algo.kernel"></span>
                  <select id="customKernel">
                    <option value="nearest" data-i18n="algo.nearest"></option>
                    <option value="bilinear" selected data-i18n="algo.bilinear"></option>
                    <option value="bicubic" data-i18n="algo.bicubic"></option>
                    <option value="lanczos" data-i18n="algo.lanczos"></option>
                  </select>
                </label>
                <label class="slider-row">
                  <span data-i18n="algo.samples"></span>
                  <input type="range" id="customSamples" min="1" max="8" step="1" value="4">
                  <output id="customSamplesOut">4×</output>
                </label>
              </div>
              <div class="custom-right">
                <span class="preview-label" data-i18n="algo.preview"></span>
                <canvas id="algoPreview"></canvas>
              </div>
            </div>
          </div>
        </div>

        <button class="btn primary block" id="generateBtn">
          <span data-i18n="btn.generate">生成像素画</span>
        </button>
      </div>

      <!-- 右：结果 -->
      <div class="col">
        <div class="card sticky-result">
          <div class="card-head">
            <h2 data-i18n="result.title"></h2>
            <span class="hint" id="resultMeta"></span>
          </div>
          <div class="result-stage" id="resultStage">
            <div class="result-empty" id="resultEmpty" data-i18n="result.empty"></div>
            <canvas id="resultCanvas" hidden></canvas>
          </div>
          <div class="btn-row wrap" id="resultActions" hidden>
            <button class="btn primary sm" id="exportBtn" data-i18n="btn.export"></button>
            <button class="btn ghost sm" id="copyAllBtn" data-i18n="btn.copyAll"></button>
            <button class="btn ghost sm" id="editBtn" data-i18n="btn.edit"></button>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ================= 色板 ================= -->
  <section class="panel" id="panel-palette">
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="palette.title"></h2>
        <span class="hint" id="paletteMeta"></span>
      </div>
      <div class="empty-state" id="paletteEmpty" data-i18n="palette.empty"></div>
      <div id="paletteBody" hidden>
        <div class="toolbar">
          <button class="btn ghost sm" id="paletteCopyAll" data-i18n="palette.copyAll"></button>
          <div class="lookup">
            <span data-i18n="palette.lookup"></span>
            <input type="number" id="lookupX" min="0" placeholder="X" inputmode="numeric">
            <input type="number" id="lookupY" min="0" placeholder="Y" inputmode="numeric">
            <button class="btn ghost sm" id="lookupGo" data-i18n="palette.lookupGo"></button>
          </div>
          <span class="hint" data-i18n="palette.hint"></span>
        </div>
        <div class="palette-scroll" id="paletteScroll">
          <div class="palette-grid" id="paletteGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= 编码 ================= -->
  <section class="panel" id="panel-code">
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="code.title"></h2>
        <span class="hint" data-i18n="code.hint"></span>
      </div>
      <div class="empty-state" id="codeEmpty" data-i18n="code.empty"></div>
      <div id="codeBody" hidden>
        <div class="code-list" id="codeList"></div>
        <button class="btn ghost block" id="loadMoreCode" data-i18n="code.loadMore"></button>
      </div>
    </div>
  </section>

  <!-- ================= 画布编辑 ================= -->
  <section class="panel" id="panel-editor">
    <div class="card">
      <div class="card-head">
        <h2 data-i18n="editor.title"></h2>
        <span class="hint" id="editorMeta"></span>
      </div>
      <div class="editor-toolbar">
        <div class="seg" id="toolSeg">
          <button class="active" data-tool="brush" data-i18n="editor.brush"></button>
          <button data-tool="eraser" data-i18n="editor.eraser"></button>
          <button data-tool="eyedropper" data-i18n="editor.eyedropper"></button>
          <button data-tool="fill" data-i18n="editor.fill"></button>
        </div>
        <label class="color-field">
          <span data-i18n="editor.color"></span>
          <input type="color" id="brushColor" value="#ffffff">
        </label>
        <button class="btn ghost sm" id="undoBtn" data-i18n="editor.undo"></button>
        <button class="btn ghost sm" id="redoBtn" data-i18n="editor.redo"></button>
        <button class="btn ghost sm" id="clearBtn" data-i18n="editor.clear"></button>
        <button class="btn ghost sm" id="importResultBtn" data-i18n="editor.fromResult"></button>
      </div>
      <div class="editor-stage" id="editorStage">
        <canvas id="editorCanvas"></canvas>
      </div>
      <div class="btn-row wrap">
        <button class="btn primary sm" id="saveWorkBtn" data-i18n="editor.save"></button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2 data-i18n="editor.history"></h2></div>
      <div class="empty-state" id="historyEmpty" data-i18n="editor.historyEmpty"></div>
      <div class="history-grid" id="historyGrid"></div>
    </div>
  </section>

  <!-- ================= 关于 ================= -->
  <section class="panel" id="panel-about">
    <div class="card prose">
      <h2 data-i18n="about.title"></h2>
      <p data-i18n="about.intro"></p>

      <h3 data-i18n="about.core"></h3>
      <ul class="feature-list">
        <li data-i18n="about.feature1"></li>
        <li data-i18n="about.feature2"></li>
        <li data-i18n="about.feature3"></li>
        <li data-i18n="about.feature4"></li>
        <li data-i18n="about.feature5"></li>
        <li data-i18n="about.feature6"></li>
      </ul>

      <h3 data-i18n="about.compat"></h3>
      <p data-i18n="about.compatBody"></p>

      <h3 data-i18n="about.links"></h3>
      <ul class="link-list">
        <li><a href="https://github.com/YYGYLTY/PixelColorPicker" target="_blank" rel="noopener" data-i18n="about.repo"></a></li>
        <li><a href="https://github.com/YYGYLTY/PixelColorPicker/releases" target="_blank" rel="noopener" data-i18n="about.releases"></a></li>
        <li><span data-i18n="about.license"></span></li>
      </ul>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="js/codec.js"></script>
<script src="js/pixelator.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
