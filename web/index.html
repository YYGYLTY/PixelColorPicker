<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090F">
<title>PixelColorPicker</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="pcp-app" id="app">

  <!-- ============ 首页 ============ -->
  <div class="pcp-page is-active" id="page-home">
    <div class="pcp-scroll" id="homeScroll">

      <!-- 1. 顶部标题行 -->
      <div class="pcp-top-header">
        <canvas class="pcp-top-logo" id="topLogo" width="80" height="80"></canvas>
        <div class="pcp-top-titles">
          <h1 class="pcp-top-title" data-s="app_name">PixelColorPicker</h1>
          <p class="pcp-top-sub" data-s="home_subtitle"></p>
        </div>
        <div class="pcp-top-actions">
          <button class="pcp-icon-btn" id="langBtn" title="Language">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/>
            </svg>
          </button>
          <button class="pcp-icon-btn" id="settingsBtn" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H22a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 2. 画布尺寸 + 常用尺寸（并排） -->
      <div class="pcp-row">
        <div class="pcp-glow-card">
          <div class="pcp-glow-inner pcp-card-pad">
            <div class="pcp-size-card">
              <div class="pcp-size-head">
                <span class="pcp-size-title" data-s="canvas_size"></span>
              </div>
              <div class="pcp-size-body">
                <div class="pcp-size-item" id="sizeW">
                  <span class="k" data-s="canvas_width"></span>
                  <span class="v" id="sizeWVal">16</span>
                </div>
                <button class="pcp-swap-btn" id="swapBtn" title="swap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M7 16H3m0 0l3-3m-3 3l3 3M17 8h4m0 0l-3-3m3 3l-3 3"/>
                  </svg>
                </button>
                <div class="pcp-size-item" id="sizeH">
                  <span class="k" data-s="canvas_height"></span>
                  <span class="v" id="sizeHVal">16</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="pcp-glow-card">
          <div class="pcp-glow-inner pcp-card-pad">
            <div class="pcp-preset-card">
              <div class="pcp-size-head">
                <span class="pcp-size-title" data-s="common_sizes"></span>
              </div>
              <div class="pcp-preset-list" id="presetList"></div>
              <button class="pcp-preset-more" id="moreSizeBtn" data-s="custom_size"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 3. 展示框 -->
      <div class="pcp-glow-card" id="displayWrap">
        <div class="pcp-glow-inner">
          <div class="pcp-display-box" id="displayBox">
            <div class="pcp-welcome" id="welcomeBox">
              <div class="pcp-welcome-line" id="welcomeLine"></div>
              <div class="pcp-welcome-line pcp-welcome-app" id="appLine"></div>
              <div class="pcp-welcome-tap" id="tapHint" data-s="display_tap"></div>
            </div>
            <canvas id="previewCanvas" hidden></canvas>
          </div>
        </div>
      </div>

      <!-- 3b. 操作行 -->
      <div id="actionsArea" hidden>
        <div class="pcp-section-gap" style="height:12px"></div>
        <div class="pcp-actions-row" id="actionsRow">
          <button class="pcp-action-btn" id="changeImgBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M7 16H3m0 0l3-3m-3 3l3 3M17 8h4m0 0l-3-3m3 3l-3 3"/>
            </svg>
            <span data-s="change_image"></span>
          </button>
          <button class="pcp-action-btn" id="recropBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 2v14a2 2 0 002 2h14M2 6h14a2 2 0 012 2v14"/>
            </svg>
            <span data-s="recrop"></span>
          </button>
          <button class="pcp-action-btn" id="gridBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
            </svg>
            <span data-s="grid_display"></span>
          </button>
          <button class="pcp-action-btn pcp-accent-warm" id="collapseBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 15l-6-6-6 6"/>
            </svg>
            <span data-s="tap_to_collapse"></span>
          </button>
        </div>
      </div>

      <div class="pcp-collapsed-row" id="collapsedRow" hidden>
        <button class="pcp-expand-btn" id="expandBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 4. 画布编辑 + 生成像素画（并排） -->
      <div class="pcp-row">
        <div class="pcp-glow-card">
          <div class="pcp-glow-inner" style="height:100%">
            <button class="pcp-duo-card" id="newCanvasBtn">
              <span class="ico pcp-circle-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 20h9M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/>
                </svg>
              </span>
              <span class="t" data-s="new_blank_canvas"></span>
              <span class="s" data-s="new_blank_hint"></span>
            </button>
          </div>
        </div>
        <div class="pcp-glow-card">
          <div class="pcp-glow-inner" style="height:100%">
            <button class="pcp-duo-card pcp-duo-generate" id="generateBtn">
              <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
                </svg>
              </span>
              <span class="t" data-s="generate"></span>
              <span class="s" data-s="generate_hint"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 5. 微调控制 -->
      <div class="pcp-glow-card">
        <div class="pcp-glow-inner pcp-card-pad">
          <div class="pcp-size-head">
            <span class="pcp-size-title" data-s="fine_tune"></span>
          </div>
          <div class="pcp-finetune-grid">
            <button class="pcp-ft-btn" data-ft="zoomin">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/><path d="M11 8v6M8 11h6M20 20l-3.5-3.5"/>
              </svg>
              <span data-s="zoom_in"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="zoomout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/>
              </svg>
              <span data-s="zoom_out"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="ccw">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/>
              </svg>
              <span data-s="rotate_ccw"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="cw">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 11-9-9 9 9 0 016.4 2.6L21 8"/><path d="M21 3v5h-5"/>
              </svg>
              <span data-s="rotate_cw"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="panup">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <span data-s="editor_pan_x"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="pandown">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
              <span data-s="editor_pan_y"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="drag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>
              </svg>
              <span data-s="drag_adjust"></span>
            </button>
            <button class="pcp-ft-btn" data-ft="reset">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
              </svg>
              <span data-s="reset"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 6. 算法选择 -->
      <div class="pcp-glow-card">
        <div class="pcp-glow-inner pcp-card-pad">
          <div class="pcp-size-head" style="margin-bottom:8px">
            <span class="pcp-size-title" data-s="algorithm"></span>
            <span class="pcp-hint" data-s="algo_hint" style="margin-left:auto"></span>
          </div>
          <div class="pcp-algo-scroll" id="algoScroll"></div>
          <div class="pcp-custom-panel" id="customPanel" hidden>
            <div class="pcp-label" data-s="custom_kernel_label"></div>
            <div class="pcp-kernel-list" id="kernelList"></div>
            <div class="pcp-label" data-s="custom_samples_label"></div>
            <div class="pcp-slider-row">
              <span data-s="custom_samples_sharp"></span>
              <input type="range" id="samplesRange" min="1" max="8" step="1" value="4">
              <output id="samplesOut">4×</output>
              <span data-s="custom_samples_soft"></span>
            </div>
            <div class="pcp-custom-preview">
              <canvas id="customPreview" width="144" height="144"></canvas>
              <span class="pcp-hint" data-s="custom_samples_hint"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap" style="height:20px"></div>

      <!-- 7. 保存到相册 -->
      <button class="pcp-save-btn" id="saveAlbumBtn" disabled data-s="save_to_album"></button>

      <div style="height:24px"></div>
    </div>
  </div>

  <!-- ============ 色板 ============ -->
  <div class="pcp-page" id="page-palette">
    <div class="pcp-scroll" id="paletteScroll">
      <h2 class="pcp-page-title" data-s="palette_title"></h2>
      <p class="pcp-page-hint" data-s="palette_hint"></p>
      <div class="pcp-empty" id="paletteEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <div class="t" data-s="empty_title"></div>
        <div class="h" data-s="empty_hint"></div>
      </div>
      <div id="paletteBody" hidden>
        <div class="pcp-palette-ruler-x" id="rulerX"></div>
        <div class="pcp-palette-main">
          <div class="pcp-palette-ruler-y" id="rulerY"></div>
          <div class="pcp-palette-canvas-wrap">
            <canvas id="paletteCanvas"></canvas>
          </div>
        </div>
        <div class="pcp-palette-tip" id="paletteTip">&nbsp;</div>
      </div>
    </div>
  </div>

  <!-- ============ 编码 ============ -->
  <div class="pcp-page" id="page-code">
    <div class="pcp-scroll">
      <h2 class="pcp-page-title" data-s="code_title"></h2>
      <p class="pcp-page-hint" data-s="code_hint"></p>
      <div class="pcp-empty" id="codeEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
        </svg>
        <div class="t" data-s="empty_title"></div>
        <div class="h" data-s="empty_hint"></div>
      </div>
      <div class="pcp-code-list" id="codeList" hidden></div>
    </div>
  </div>

  <!-- ============ 关于 ============ -->
  <div class="pcp-page" id="page-about">
    <div class="pcp-scroll" id="aboutScroll"></div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <nav class="pcp-bottom-nav" id="bottomNav">
    <button class="pcp-nav-item is-active" data-tab="home">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_home"></span>
    </button>
    <button class="pcp-nav-item" data-tab="palette">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="9" cy="9" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="9" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="9" cy="15" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="15" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_palette"></span>
    </button>
    <button class="pcp-nav-item" data-tab="code">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <path d="M9 18l-6-6 6-6M15 6l6 6-6 6"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_code"></span>
    </button>
    <button class="pcp-nav-item" data-tab="about">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
          <circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.6"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_about"></span>
    </button>
  </nav>

</div>

<!-- 弹窗层 -->
<div class="pcp-dialog-mask" id="dialogMask" hidden>
  <div class="pcp-dialog" id="dialogBox"></div>
</div>

<div class="pcp-toast" id="toast"></div>

<!-- 隐藏的文件选择 -->
<input type="file" id="fileInput" accept="image/*" hidden>

<!-- 脚本 -->
<script src="js/i18n_data.js"></script>
<script src="js/codec.js"></script>
<script src="js/pixelator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
