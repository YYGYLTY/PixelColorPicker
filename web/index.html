<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090F">
<title>PixelColorPicker</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="pcp-app" id="app">

  <!-- ==================== 首页 ==================== -->
  <div class="pcp-page is-active" id="page-home">
    <div class="pcp-scroll" id="homeScroll">

      <!-- 1. TopHeader：Logo(44圆底) + 渐变标题 + 设置按钮 -->
      <div class="pcp-top-header">
        <div class="pcp-top-logo-wrap">
          <canvas class="pcp-top-logo" id="topLogo" width="64" height="64"></canvas>
        </div>
        <div class="pcp-top-titles">
          <h1 class="pcp-top-title" id="topTitle">PixelColorPicker</h1>
          <p class="pcp-top-sub" data-s="home_subtitle"></p>
        </div>
        <button class="pcp-settings-btn" id="settingsBtn" aria-label="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path fill="currentColor" stroke="none" d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/>
          </svg>
        </button>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 2. 画布尺寸 + 常用尺寸（并排，间距 16dp） -->
      <div class="pcp-row">
        <!-- CanvasSizeCard -->
        <div class="pcp-glow-card">
          <div class="pcp-glow-inner pcp-card-pad">
            <div class="pcp-card-title-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4,5h16v14H4zM4,9h16M9,5v14"/>
              </svg>
              <span class="pcp-card-title" data-s="canvas_size"></span>
            </div>
            <div class="pcp-size-body">
              <div class="pcp-size-input" id="sizeW">
                <span class="lb">W</span>
                <span class="val" id="sizeWVal">16</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="none"><path fill="currentColor" d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z"/></svg>
              </div>
              <button class="pcp-swap-btn" id="swapBtn" aria-label="swap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path fill="currentColor" stroke="none" d="M6.99,11L3,15l3.99,4v-3H14v-2H6.99v-3zM21,9l-3.99,-4v3H10v2h7.01v3L21,9z"/>
                </svg>
              </button>
              <div class="pcp-size-input" id="sizeH">
                <span class="lb">H</span>
                <span class="val" id="sizeHVal">16</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="none"><path fill="currentColor" d="M7.41,8.59L12,13.17l4.59,-4.58L18,10l-6,6 -6,-6z"/></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- CommonSizesCard -->
        <div class="pcp-glow-card">
          <div class="pcp-glow-inner pcp-card-pad">
            <div class="pcp-card-title-row">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M4,4h6v6H4zM14,4h6v6h-6zM4,14h6v6H4zM17,13.5l1,2 2.2,0.3 -1.6,1.5 0.4,2.2 -2,-1.1 -2,1.1 0.4,-2.2 -1.6,-1.5 2.2,-0.3z"/>
              </svg>
              <span class="pcp-card-title" data-s="common_sizes"></span>
            </div>
            <div class="pcp-preset-list" id="presetList"></div>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 3. 展示框 -->
      <div class="pcp-glow-card" id="displayWrap">
        <div class="pcp-glow-inner">
          <div class="pcp-display-box" id="displayBox">
            <div class="pcp-welcome" id="welcomeBox">
              <div class="pcp-welcome-line" id="welcomeLine"></div>
              <div class="pcp-welcome-tap" id="tapHint" data-s="display_tap"></div>
            </div>
            <canvas id="previewCanvas" hidden></canvas>
          </div>
        </div>
      </div>

      <!-- 3b. 操作行（有图片时显示） -->
      <div id="actionsArea" hidden>
        <div style="height:12px"></div>
        <div class="pcp-actions-row" id="actionsRow">
          <button class="pcp-action-btn" id="changeImgBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 8h13M14 5l3 3-3 3M20 16H7M10 13l-3 3 3 3"/>
            </svg>
            <span data-s="change_image"></span>
          </button>
          <button class="pcp-action-btn" id="recropBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 2v14a2 2 0 002 2h14M2 6h14a2 2 0 012 2v14"/>
            </svg>
            <span data-s="recrop"></span>
          </button>
          <button class="pcp-action-btn" id="gridBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
            </svg>
            <span data-s="grid_display"></span>
          </button>
          <button class="pcp-action-btn pcp-accent-warm" id="collapseBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
            <span data-s="tap_to_collapse"></span>
          </button>
        </div>
      </div>

      <div class="pcp-collapsed-row" id="collapsedRow" hidden>
        <button class="pcp-expand-btn" id="expandBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 4. 画布编辑 + 生成像素画（并排，18dp 圆角，带强调描边） -->
      <div class="pcp-row">
        <div class="pcp-accent-card blue">
          <div class="inner">
            <button class="pcp-duo-card pcp-duo-blue" id="newCanvasBtn">
              <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5,5.5l4,4M4,20l1,-4.5L15.5,5a2.12,2.12 0 0 1 3,3L8,18.5 4,20z"/>
                </svg>
              </span>
              <span class="txt">
                <span class="t" data-s="new_blank_canvas"></span>
                <span class="s" data-s="new_blank_hint"></span>
              </span>
            </button>
          </div>
        </div>

        <div class="pcp-accent-card orange">
          <div class="inner">
            <button class="pcp-duo-card pcp-duo-generate pcp-duo-orange" id="generateBtn">
              <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5,19L15,9M15,9l2,-2M13.5,4.5l0.6,1.4 1.4,0.6 -1.4,0.6 -0.6,1.4 -0.6,-1.4 -1.4,-0.6 1.4,-0.6zM19,13l0.5,1.2 1.2,0.5 -1.2,0.5 -0.5,1.2 -0.5,-1.2 -1.2,-0.5 1.2,-0.5z"/>
                </svg>
              </span>
              <span class="txt">
                <span class="t" data-s="generate"></span>
                <span class="s" data-s="generate_hint"></span>
              </span>
              <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 5. 微调控制：标题行(拖拽调整/重置) + 左2 + 中十字 + 右2 -->
      <div class="pcp-glow-card">
        <div class="pcp-glow-inner" style="padding:16px">
          <div class="pcp-ft-head">
            <span class="title" data-s="fine_tune"></span>
            <button class="pcp-pill" id="dragPill" data-s="drag_adjust"></button>
            <button class="pcp-pill danger" id="resetPill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
              </svg>
              <span data-s="reset"></span>
            </button>
          </div>

          <div class="pcp-ft-body">
            <!-- 左列：放大 / 缩小 -->
            <div class="pcp-ft-col">
              <button class="pcp-micro-btn" data-ft="zoomin">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M12 5v14M5 12h14"/>
                </svg>
                <span data-s="zoom_in"></span>
              </button>
              <button class="pcp-micro-btn" data-ft="zoomout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M5 12h14"/>
                </svg>
                <span data-s="zoom_out"></span>
              </button>
            </div>

            <!-- 中间：十字方向键 -->
            <div class="pcp-cross">
              <button class="pcp-sq-btn" data-ft="panup">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
              <div class="row">
                <button class="pcp-sq-btn" data-ft="panleft">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                </button>
                <button class="pcp-sq-btn" data-ft="panright">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
              </div>
              <button class="pcp-sq-btn" data-ft="pandown">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
              </button>
            </div>

            <!-- 右列：逆时针 / 顺时针 -->
            <div class="pcp-ft-col">
              <button class="pcp-micro-btn" data-ft="ccw">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/>
                </svg>
                <span data-s="rotate_ccw"></span>
              </button>
              <button class="pcp-micro-btn" data-ft="cw">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 12a9 9 0 11-9-9 9 9 0 016.4 2.6L21 8"/><path d="M21 3v5h-5"/>
                </svg>
                <span data-s="rotate_cw"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="pcp-section-gap"></div>

      <!-- 6. 算法选择 -->
      <div class="pcp-glow-card">
        <div class="pcp-glow-inner pcp-card-pad">
          <div class="pcp-card-title-row" style="margin-bottom:8px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="pcp-card-title" data-s="algorithm"></span>
            <span class="pcp-hint" data-s="algo_hint" style="margin-left:auto;font-size:10px"></span>
          </div>
          <div class="pcp-algo-scroll" id="algoScroll"></div>
          <div class="pcp-custom-panel" id="customPanel" hidden>
            <div class="pcp-hint" data-s="custom_kernel_label"></div>
            <div class="pcp-kernel-list" id="kernelList"></div>
            <div class="pcp-hint" data-s="custom_samples_label"></div>
            <div class="pcp-slider-row">
              <span data-s="custom_samples_sharp"></span>
              <input type="range" id="samplesRange" min="1" max="8" step="1" value="4">
              <output id="samplesOut">4×</output>
              <span data-s="custom_samples_soft"></span>
            </div>
            <div class="pcp-custom-preview">
              <canvas id="customPreview" width="144" height="144"></canvas>
              <span class="pcp-hint" data-s="custom_samples_hint"></span>
            </div>
          </div>
        </div>
      </div>

      <div style="height:20px"></div>

      <!-- 7. 保存图片到相册 -->
      <button class="pcp-save-btn" id="saveAlbumBtn" disabled>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="none"><path fill="currentColor" d="M19,9h-4V3H9v6H5l7,7 7,-7zM5,18v2h14v-2H5z"/></svg>
        <span id="saveAlbumLabel"></span>
      </button>
    </div>
  </div>

  <!-- ==================== 色板 ==================== -->
  <div class="pcp-page" id="page-palette">
    <div class="pcp-scroll">
      <div class="pcp-page-head">
        <h2 class="pcp-page-title" id="paletteTitle" data-s="palette_title"></h2>
        <button class="pcp-pal-search" id="palSearchBtn" hidden aria-label="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="none"><path fill="currentColor" d="M15.5,14h-0.79l-0.28,-0.27C15.41,12.59 16,11.11 16,9.5 16,5.91 13.09,3 9.5,3S3,5.91 3,9.5 5.91,16 9.5,16c1.61,0 3.09,-0.59 4.23,-1.57l0.27,0.28v0.79l5,4.99L20.49,19l-4.99,-5zm-6,0C7.01,14 5,11.99 5,9.5S7.01,5 9.5,5 14,7.01 14,9.5 11.99,14 9.5,14z"/></svg>
        </button>
        <button class="pcp-pal-search pcp-refresh" id="palRefreshBtn" hidden aria-label="refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></svg>
        </button>
      </div>
      <p class="pcp-page-hint" data-s="palette_hint"></p>
      <div class="pcp-empty" id="paletteEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <div class="t" data-s="empty_title"></div>
        <div class="h" data-s="empty_hint"></div>
      </div>
      <div id="paletteBody" hidden>
        <!-- 横向快速滑块（同 PaletteGrid 的 QuickBar） -->
        <div class="pcp-pal-hbar" id="palHBar"><div class="pcp-qb-track"></div><div class="pcp-qb-thumb" id="palHThumb"></div></div>
        <!-- X 标尺（左侧留 28px 给 Y 标尺） -->
        <div class="pcp-pal-rx-row">
          <div class="pcp-pal-rx-pad"></div>
          <div class="pcp-pal-rx" id="rulerX"></div>
          <div class="pcp-pal-rx-pad"></div>
        </div>
        <!-- 主体：Y 标尺 + 网格视口 + 纵向滑块 -->
        <div class="pcp-pal-main">
          <div class="pcp-pal-ry" id="rulerY"></div>
          <div class="pcp-pal-viewwrap">
            <canvas id="paletteCanvas"></canvas>
            <div class="pcp-pal-view" id="palView">
              <div class="pcp-pal-spacer" id="palSpacer"></div>
            </div>
          </div>
          <div class="pcp-pal-vbar" id="palVBar"><div class="pcp-qb-track"></div><div class="pcp-qb-thumb" id="palVThumb"></div></div>
        </div>
        <div class="pcp-palette-tip" id="paletteTip">&nbsp;</div>
      </div>
    </div>
  </div>

  <!-- ==================== 编码 ==================== -->
  <div class="pcp-page" id="page-code">
    <div class="pcp-scroll" id="codeScroll">
      <div class="pcp-page-head">
        <h2 class="pcp-page-title" data-s="code_title"></h2>
        <button class="pcp-pal-search pcp-refresh" id="codeRefreshBtn" hidden aria-label="refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4c-4.42,0 -7.99,3.58 -7.99,8s3.57,8 7.99,8c3.73,0 6.84,-2.55 7.73,-6h-2.08c-0.82,2.33 -3.04,4 -5.65,4 -3.31,0 -6,-2.69 -6,-6s2.69,-6 6,-6c1.66,0 3.14,0.69 4.22,1.78L13,11h7V4l-2.35,2.35z"/></svg>
        </button>
      </div>
      <p class="pcp-page-hint" data-s="code_hint"></p>
      <div class="pcp-empty" id="codeEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
        </svg>
        <div class="t" data-s="empty_title"></div>
        <div class="h" data-s="empty_hint"></div>
      </div>
      <div class="pcp-code-list" id="codeList" hidden></div>
      <div class="pcp-quickbar" id="codeQb" hidden>
        <div class="pcp-qb-track"></div>
        <div class="pcp-qb-thumb" id="codeQbThumb"></div>
      </div>
    </div>
  </div>

  <!-- ==================== 关于 ==================== -->
  <div class="pcp-page" id="page-about">
    <div class="pcp-scroll" id="aboutScroll"></div>
  </div>

  <!-- ==================== 底部悬浮导航 ==================== -->
  <nav class="pcp-bottom-nav" id="bottomNav">
    <button class="pcp-nav-item is-active" data-tab="home">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.6,10.8 L12,4.2 L20.4,10.8 M6,9.6 L6,19.6 L18,19.6 L18,9.6 M10.2,19.6 L10.2,14.2 L13.8,14.2 L13.8,19.6"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_home"></span>
    </button>
    <button class="pcp-nav-item" data-tab="palette">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.4,12 A8.4,8.4 0 1 1 3.6,12 A8.4,8.4 0 1 1 20.4,12 Z"/>
          <circle cx="9" cy="9.4" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="15" cy="9.4" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="9" cy="15" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="15.2" cy="15.2" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="pcp-nav-label" data-s="tab_palette"></span>
    </button>
    <button class="pcp-nav-item" data-tab="code">
      <span class="pcp-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.6,6.4 L4.2,12 L8.6,17.6 M15.4,6.4 L19.8,12 L15.4,17.6 M13.4,5.4 L10.6,18.6"/>
        </svg>
      </span>
